<div class="equipamentos-page">
  <!-- Header -->
   <h1>Marcas</h1>

    <!-- Filtros -->
    <div class="filtros">
      <ng-select [items]="marcas" bindLabel="nome" bindValue="nome" [(ngModel)]="filtroNome" placeholder="Marca" [clearable]="true"></ng-select>

      <button class="novo-btn" (click)="abrirModal(true)">
        <i class="fas fa-plus"></i> Nova Marca
      </button>
    </div>
  
    <!-- Tabela -->
    <div class="tabela-wrapper">
    <table>
      <thead>
        <tr>
          <th>Id</th>
          <th>Nome</th>
          <th>Data de Registo</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let m of getMarcasFiltradas()">
          <td>{{ m.id }}</td>
          <td>{{ m.nome }}</td>
          <td>{{ m.dataRegisto }}</td>
          <td class="acoes">
            <button class="btn-edit" (click)="abrirModal(false, m)" aria-label="Editar">
              <i class="fas fa-edit" aria-hidden="true"></i>
            </button>
            <button class="btn-delete" (click)="excluir(m.id)" aria-label="Apagar">
              <i class="fas fa-trash-alt" aria-hidden="true"></i>
            </button>
            <button class="btn-view" [routerLink]="['/marcas', m.id]" aria-label="Visualizar">
              <i class="fas fa-eye" aria-hidden="true"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
    </div>
  
    <!-- Modal -->
    <div class="modal-overlay" *ngIf="showModal">
      <div class="modal">
        <h2>{{ editando ? 'Editar' : 'Nova' }} Marca</h2>
        <div class="modal-banner">
          <img src="assets/MarcasModelos.png" alt="Marcas e Modelos" />
        </div>
        <form [formGroup]="form" (ngSubmit)="salvar()">
          <div class="form-grid">
            <div>
                <label>Nome: *</label>
                <input type="text" formControlName="nome" />
                <small *ngIf="form.get('nome')?.touched && form.get('nome')?.invalid" class="erro">Obrigatório</small>
            </div>

            <div>
                <label>Data de Registo: *</label>
                <input type="date" formControlName="dataRegisto" />
                <small *ngIf="form.get('dataRegisto')?.touched && form.get('dataRegisto')?.invalid" class="erro">Obrigatório</small>
            </div>

          </div>
  
          <div class="modal-actions">
            <button type="submit" [disabled]="form.invalid">Salvar</button>
            <button type="button" (click)="fecharModal()">Cancelar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
