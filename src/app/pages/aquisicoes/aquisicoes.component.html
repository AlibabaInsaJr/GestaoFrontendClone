<div class="equipamentos-page">
  <!-- Header -->
  <h1>Aquisições</h1>

  <!-- Filtros -->
  <div class="filtros">
    <ng-select [items]="empresas" bindLabel="designacao" bindValue="id" [(ngModel)]="filtroEmpresa" placeholder="Empresa" [clearable]="true"></ng-select>

    <ng-select [items]="concursos" [(ngModel)]="filtroNumeroConcurso" placeholder="N.º Concurso" [clearable]="true"></ng-select>

    <button class="novo-btn" (click)="abrirModal(true)">
      <i class="fas fa-plus"></i> Nova Aquisição
    </button>
  </div>

  <!-- Tabela -->
  <div class="tabela-wrapper">
    <table>
      <thead>
        <tr>
          <th>Id</th>
          <th>Data Registo</th>
          <th>Descrição</th>
          <th>N.º Concurso</th>
          <th>Caminho do Contrato</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let aq of getAquisicoesFiltradas()">
          <td>{{ aq.id }}</td>
          <td>{{ aq.dataAquisicao }}</td>
          <td>{{ aq.descricao }}</td>
          <td>{{ aq.numeroConcurso }}</td>
          <td>
            <ng-container *ngIf="aq.pathContracto; else semContrato">
              <span>Anexo Carregado</span>
            </ng-container>
            <ng-template #semContrato>—</ng-template>
          </td>
          <td class="acoes">
            <button class="btn-edit" (click)="abrirModal(false, aq)" aria-label="Editar">
              <i class="fas fa-edit" aria-hidden="true"></i>
            </button>
            <button class="btn-delete" (click)="excluir(aq.id)" aria-label="Apagar">
              <i class="fas fa-trash-alt" aria-hidden="true"></i>
            </button>
            <button class="btn-view" [routerLink]="['/aquisicoes', aq.id]" aria-label="Visualizar">
              <i class="fas fa-eye" aria-hidden="true"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

    <!-- Modal -->
    <div class="modal-overlay" *ngIf="showModal">
      <div class="modal modern-form">
        <h2>{{ editando ? 'Editar' : 'Nova' }} Aquisição</h2>
  
        <form [formGroup]="form" (ngSubmit)="salvar()">
<div class="form-grid">
    
            <div>
              <label>Descrição: *</label>
              <input type="text" formControlName="descricao" />
              <small *ngIf="form.get('descricao')?.touched && form.get('descricao')?.invalid" class="erro">
                Obrigatório
              </small>
            </div>
    
            <div>
              <label>Data da Aquisição: *</label>
              <input type="date" formControlName="dataAquisicao" />
              <small *ngIf="form.get('dataAquisicao')?.touched && form.get('dataAquisicao')?.invalid" class="erro">
                Obrigatório
              </small>
            </div>
    
            <div>
              <label>N.º do Concurso: *</label>
              <input type="text" formControlName="numeroConcurso" />
              <small *ngIf="form.get('numeroConcurso')?.touched && form.get('numeroConcurso')?.invalid" class="erro">
                Obrigatório
              </small>
            </div>
    
            <div>
              <app-file-upload
                 formControlName="pathContracto"
                 label="Contrato de Aquisição:"
                 placeholder="Selecionar arquivo"
                 accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"
                 size="compact"
                 [showFileName]="false"
                 loadedText="(Carregado)"
                 [required]="false"
                 (error)="onFileError($event)">
               </app-file-upload>
            </div>

            <!-- Campo de Marca e Modelos removido conforme solicitação -->
            
            <div>
              <label>Empresa: *</label>
              <ng-select
                [items]="empresas"
                bindLabel="designacao"
                bindValue="id"
                formControlName="empresaId"
                placeholder="Selecione"
                [clearable]="true">
              </ng-select>
            </div>
    
          </div>
  
          <div class="modal-actions">
            <button type="submit" [disabled]="form.invalid">Salvar</button>
            <button type="button" (click)="fecharModal()">Cancelar</button>
          </div>
        </form>
      </div>
    </div>
